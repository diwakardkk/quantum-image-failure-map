[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-image-failure-map"
version = "0.1.0"
description = "Experimental diagnostics for failure modes in quantum image classification."
requires-python = ">=3.11"
authors = [{name = "Quantum Image Failure Map Contributors"}]
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

